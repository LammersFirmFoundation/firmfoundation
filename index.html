<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6efdc" />
    <!-- `?v=` because browsers keep their own icon cache, apart from the HTTP
         cache, and the badge icons (2026-10-17) reuse the old icons' file
         names: without a new URL a returning visitor can keep the old tab
         icon for weeks. Bump it whenever an icon file changes. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <!-- iOS applies its own rounded mask, so this one is full-bleed square
         with no alpha; the browser icons above keep their own rounding. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Besley:ital,wght@0,500..700;1,400..500&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
    <meta name="author" content="Firm Foundation Property Services" />

    <!-- Per-route title, description, canonical, Open Graph, Twitter, geo, and
         JSON-LD structured data are rendered into the static HTML at build time
         by the SEO component (vite-react-ssg Head). Page-specific SEO is kept
         out of this template to avoid duplicate tags. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
